[project]
name = "sbx-gateway-mediator"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = ["mitmproxy==12.2.3"]

[tool.uv]
environments = [
  "implementation_name == 'cpython' and sys_platform == 'linux'",
  "implementation_name == 'cpython' and sys_platform == 'darwin'",
]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# Temporary reviewed security overrides. Remove when mitmproxy metadata admits
# fixed msgpack and Tornado releases, after rerunning compatibility gates.
override-dependencies = [
  "msgpack==1.2.1",
  "tornado==6.5.7",
]
