name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.30"

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: gateway/go.sum

      - name: Verify gateway artifacts and installed mediator
        run: |
          set -euo pipefail
          GO=go gateway/scripts/build_release_artifacts.sh
          git diff --exit-code -- src/sbx/gateway_runtime
          UV_TOOL_DIR="$RUNNER_TEMP/sbx-tool" UV_TOOL_BIN_DIR="$RUNNER_TEMP/sbx-bin" \
            uv tool install --from . sbx --python 3.12
          "$RUNNER_TEMP/sbx-bin/sbx" --version
          test -x "$RUNNER_TEMP/sbx-bin/mitmdump"
          test -x "$RUNNER_TEMP/sbx-bin/mitmweb"
          worker=$("$RUNNER_TEMP/sbx-tool/sbx/bin/python" -c \
            'from sbx.gateway import GATEWAY_WORKER; print(GATEWAY_WORKER)')
          test -x "$worker"
          test "$("$worker" 2>&1 || true)" = "sbx-gateway: --config must be an absolute path"
          uv sync --locked --no-build --no-dev --python 3.12
          uv audit --locked
          uv run --extra dev pytest --no-cov gateway/mediator

      - name: Run Go tests
        run: GOTOOLCHAIN=local go -C gateway test ./...

      - name: Run tests
        run: uv run --python 3.12 --extra dev pytest

      - name: Install integration-test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-system-x86

      - name: Build integration-test guest
        run: gateway/scripts/build_test_guest.sh

      - name: Run integration tests
        timeout-minutes: 10
        env:
          SBX_GATEWAY_BIN: ${{ github.workspace }}/src/sbx/gateway_runtime/bin/sbx-gateway-linux-amd64
        run: uv run --python 3.12 --extra dev pytest --no-cov -s tests/integration

      - name: Run ruff
        run: uv run --python 3.12 --extra dev ruff check .

      - name: Validate complexity report generation
        run: |
          python .github/scripts/generate_complexity_report.py . --output /tmp/complexity.html
          grep -q "High and superior complexity" /tmp/complexity.html
